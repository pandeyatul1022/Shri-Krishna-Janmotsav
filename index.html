<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description"
        content="श्रीकृष्ण जन्मोत्सव 2026 - कृष्ण जन्माष्टमी लाइव उलटी गिनती (Live Countdown Timer)">
    <title>श्रीकृष्ण जन्मोत्सव 2026 | Live Countdown Timer</title>

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome 6 Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- Custom Production Stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- Night Sky Twinkling Stars Canvas, Celestial Glow & Watermark Motif -->
    <canvas id="star-canvas" aria-hidden="true"></canvas>
    <div class="bg-aura" aria-hidden="true"></div>
    <div class="moon-glow" aria-hidden="true"></div>
    <div class="peacock-watermark" aria-hidden="true"><i class="fas fa-feather-alt"></i></div>

    <!-- Main Outer Flex Wrapper -->
    <div class="min-vh-100 d-flex flex-column justify-content-between px-2 px-sm-3 py-3 py-md-4">

        <!-- Semantic App Header -->
        <header class="app-header my-auto pt-2 pt-md-3">
            <div class="live-indicator">
                <span class="pulse-dot"></span>
                <span>✦ LIVE COUNTDOWN</span>
            </div>

            <h1 class="hero-title font-heading mb-2 mb-md-3">श्रीकृष्ण जन्मोत्सव 2026</h1>

            <div class="date-badge font-hindi">
                <i class="fas fa-feather-alt me-2" aria-hidden="true"></i>
                <time datetime="2026-09-04">4 सितंबर 2026 (श्रीकृष्ण जन्माष्टमी)</time>
            </div>
        </header>

        <!-- Semantic Main Section for Realistic 3D Countdown Grid -->
        <main class="container my-auto">
            <section class="countdown-section w-100 mx-auto" aria-labelledby="countdown-heading">
                <h2 id="countdown-heading" class="visually-hidden">जन्माष्टमी उलटी गिनती टाइमर</h2>

                <div class="row g-2 g-sm-3 g-md-4 justify-content-center" role="timer" aria-live="polite">

                    <!-- Days Block -->
                    <div class="col-6 col-sm-6 col-md-3 countdown-card-wrapper">
                        <article class="countdown-box">
                            <div class="top-rim"></div>
                            <span id="days" class="number-display">00</span>
                            <span class="label-display">DAYS</span>
                        </article>
                    </div>

                    <!-- Hours Block -->
                    <div class="col-6 col-sm-6 col-md-3 countdown-card-wrapper">
                        <article class="countdown-box">
                            <div class="top-rim"></div>
                            <span id="hours" class="number-display">00</span>
                            <span class="label-display">HOURS</span>
                        </article>
                    </div>

                    <!-- Minutes Block -->
                    <div class="col-6 col-sm-6 col-md-3 countdown-card-wrapper">
                        <article class="countdown-box">
                            <span id="minutes" class="number-display">00</span>
                            <span class="label-display">MINUTES</span>
                        </article>
                    </div>

                    <!-- Seconds Block -->
                    <div class="col-6 col-sm-6 col-md-3 countdown-card-wrapper">
                        <article class="countdown-box">
                            <div class="top-rim"></div>
                            <span id="seconds" class="number-display">00</span>
                            <span class="label-display">SECONDS</span>
                        </article>
                    </div>

                </div>

                <!-- Celebration Message (Displayed dynamically on arrival) -->
                <div id="celebration-message" class="text-center mt-3 mt-md-4 d-none" aria-live="assertive">
                    <h3 class="text-warning font-heading display-6 fs-4 fs-md-3">🎉 नन्द के आनन्द भयो, जय कन्हैया लाल
                        की! 🎉</h3>
                </div>
            </section>
        </main>

        <!-- Semantic App Footer -->
        <footer class="app-footer text-center py-2 py-md-3 mt-auto rounded-pill max-w-lg mx-auto px-3 px-md-4">
            <p class="mb-0 footer-text font-hindi">
                🚩 हाथी घोड़ा पालकी, जय कन्हैया लाल की! 🚩
            </p>
        </footer>

    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Master Main JavaScript Engine -->
    <script src="assets/js/main.js"></script>
</body>

</html>
